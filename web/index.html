<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Melos · KA Music 在线音乐播放器 PWA">
  <meta name="theme-color" content="#5b7af0">
  <meta name="application-name" content="Melos">

  <!-- PWA / iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Melos">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Melos · KA Music</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* iOS Safari 聚焦字号小于 16px 的输入框时会自动放大页面，而 Flutter
       的手势层会拦截双指缩小，导致放大后无法恢复。把引擎的隐藏输入框
       字号统一提到 16px，即可避免聚焦自动缩放（画布内文字大小不受影响）。 */
    flt-text-editing-host input,
    flt-text-editing-host textarea,
    flt-text-editing-host [contenteditable="true"],
    flt-semantics-host input,
    flt-semantics-host textarea,
    .flt-text-editing {
      font-size: 16px !important;
    }
  </style>

  <script>
    // iPhone/iPad 的 DPR 通常为 3，Flutter Web（CanvasKit）按物理像素渲染
    // 整块画布。PWA 中叠加实时模糊与动画时 GPU 压力很大，容易卡顿、发热。
    // 把渲染倍率限制到 2 倍：布局尺寸不变，像素量约减少 55%。
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!isIOS) return;
      try {
        var cap = 2;
        if ((window.devicePixelRatio || 1) <= cap) return;
        Object.defineProperty(window, 'devicePixelRatio', {
          configurable: true,
          get: function () { return cap; }
        });
      } catch (e) {
        // 无法覆盖时保持浏览器默认值。
      }
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
