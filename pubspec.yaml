name: kgka_music_hl
description: "the best music application"
publish_to: 'none'
version: 3.3.0

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.18
  audio_session: ^0.2.4
  audio_metadata_reader: ^1.8.0
  charset: ^2.0.1
  crypto: ^3.0.3
  http: ^1.5.0
  just_audio: ^0.10.4
  just_audio_windows: ^0.2.3
  # Linux desktop audio backend (media_kit / libmpv). Used by Docker deployment.
  just_audio_media_kit: ^2.1.0
  media_kit_libs_linux: ^1.2.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  dio: ^5.7.0
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  file_picker: ^12.0.0
  flutter_lyric: ^3.0.7
  permission_handler: ^13.0.1
  lpinyin: ^2.0.3
  liquid_glass_easy: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# 网页端切歌修复：just_audio_web 0.4.16 会缓存首次 load 的音源树，导致网页端
# 切歌后仍播放同一首歌。上游修复（ryanheise/just_audio#1593）尚未发布到
# pub.dev，因此内置打过补丁的 0.4.17。
dependency_overrides:
  just_audio_web:
    path: third_party/just_audio_web

flutter:
  uses-material-design: true
  assets:
    - update.md
    - lib/assets/logo.png
